name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Complete quality gate (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The runner inspects the working tree/index and builds from the checkout.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install project and pinned tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Run the integral quality runner
        run: python scripts/run_quality_checks.py

  tests:
    name: Tests and coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and pinned tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Complete pytest suite with the 99% gate
        run: pytest tests/agent_loop --cov=agent_loop --cov-report=term-missing --cov-fail-under=99

  package:
    name: Build and install distribution (Python 3.14)
    runs-on: ubuntu-latest
    needs: [quality-gate, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify LICENSE and package content in both artifacts
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          required = (
              "agent_loop/__init__.py",
              "agent_loop/autonomy/cli.py",
              "agent_loop/autonomy/__main__.py",
              "pyproject.toml",
              "README.md",
          )
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(name.rsplit("/", 1)[-1] == "LICENSE" for name in names)
              assert all(any(name == item or name.endswith("/" + item) for name in names) for item in required[:-2])
          with tarfile.open(sdist, "r:gz") as archive:
              names = [member.name for member in archive.getmembers()]
              assert any(name.rsplit("/", 1)[-1] == "LICENSE" for name in names)
              assert all(any(name == item or name.endswith("/" + item) for name in names) for item in required)
          print("LICENSE and required package members present in wheel and sdist")
          PY
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "${RUNNER_TEMP}/agent-loop-wheel"
          "${RUNNER_TEMP}/agent-loop-wheel/bin/python" -m pip install dist/*.whl
      - name: Import installed package and verify metadata
        working-directory: ${{ runner.temp }}
        run: |
          "${RUNNER_TEMP}/agent-loop-wheel/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import agent_loop

          distribution = metadata.distribution("agent-loop-autonomous")
          assert distribution.version == "0.1.0"
          assert distribution.metadata["License-Expression"] == "MIT"
          assert distribution.metadata["License-File"] == "LICENSE"
          print(agent_loop.__file__, distribution.version)
          PY
      - name: Installed console script
        working-directory: ${{ runner.temp }}
        run: |
          "${RUNNER_TEMP}/agent-loop-wheel/bin/agent-loop" --version
          "${RUNNER_TEMP}/agent-loop-wheel/bin/agent-loop" --help
      - name: Installed module entrypoint
        working-directory: ${{ runner.temp }}
        run: |
          "${RUNNER_TEMP}/agent-loop-wheel/bin/python" -m agent_loop.autonomy --version
          "${RUNNER_TEMP}/agent-loop-wheel/bin/python" -m agent_loop.autonomy --help
      - name: Check installed dependencies
        working-directory: ${{ runner.temp }}
        run: |
          "${RUNNER_TEMP}/agent-loop-wheel/bin/python" -m pip check
