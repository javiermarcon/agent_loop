[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-loop-autonomous"
version = "0.1.0"
description = "Autonomous Agent Loop for external Django repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
agent-loop = "agent_loop.autonomy.cli:main"

[tool.setuptools.packages.find]
include = ["agent_loop*"]

[tool.pytest.ini_options]
testpaths = ["checks"]
python_files = ["check_*.py"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 119
extend-exclude = ["fixtures", "agent_loop/application/resume_config_migration.py"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "C4",
  "SIM",
  "S",
  "PTH",
  "RET",
  "BLE",
  "PERF",
  "RUF",
  "TC",
  "PL",
  "T20",
]
ignore = ["RUF036", "S101", "S607", "SIM108", "UP038"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
