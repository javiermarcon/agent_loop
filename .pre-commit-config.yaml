minimum_pre_commit_version: "3.7.0"

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy agent_loop tests
        language: system
        types: [python]
        pass_filenames: false
      - id: pylint
        name: pylint
        entry: pylint agent_loop tests
        language: system
        types: [python]
        pass_filenames: false
